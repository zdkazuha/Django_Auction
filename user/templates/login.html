{% extends 'layout.html' %}

{% block content %}
<div class="row justify-content-center mt-5" style="height: 610px;">
  <div class="col-md-4" style="margin-top: 75px;">
    <h2 class="mb-4 text-center">Login</h2>

    <form method="post">
      {% csrf_token %}

      <div class="mb-3">
        <label class="form-label">Username</label>
        <input
          type="text"
          name="username"
          class="form-control"
          required
        />
      </div>

      <div class="mb-3">
        <label class="form-label">Password</label>
        <input
          type="password"
          name="password"
          class="form-control"
          required
        />
      </div>

      <button type="submit" class="btn btn-primary w-100">
        Login
      </button>
    </form>
  </div>
</div>
{% endblock %}
