<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <title>Lots</title>
    <style>
      body {
        background-color: #0b0d12;
        color: #eaeaea;
      }

      .navbar {
        background: rgba(20, 22, 30, 0.7) !important;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }

      .navbar-brand,
      .navbar .nav-link {
        color: #f1f1f1 !important;
      }

      .navbar .nav-link:hover {
        color: #c9b37e !important;
      }
  </style>

  </head>

  <body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container-fluid">
        <a class="navbar-brand" aria-current="page" href="/">BestAuction</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link" href="/favorites">Favorites ({{ favorite_count }})</a>
            </li>
            <li>
              <a class="nav-link" href="{% url 'auctions_list' %}">Auctions List</a>
            </li>
            <li>
              <a class="nav-link" href="{% url 'auctions_index' %}">Auctions</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{% url 'lots_list' %}">Lots list</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{% url 'lots_index' %}">Lots</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container">{% block content %} {% endblock %}</div>

    <footer class="mt-5 py-4 text-center"
            style="background: rgba(20,22,30,.6); border-top:1px solid rgba(255,255,255,.08);">
      <div class="container">
        <small class="text-secondary">
          © 2026 BestAuction. All rights reserved.
        </small>
      </div>
    </footer>

    {% include 'lots/components/toast.html' %}

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>

    {% block scripts %}{% endblock %}
  </body>
</html>
